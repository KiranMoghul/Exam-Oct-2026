<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personality Development &amp; Identifying Personality Types</title>
<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --dim:#8a8a8a;
    --line:#2a2a2a;
    --line-soft:#1a1a1a;
    --green:#22c55e;
    --red:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .screen{
    display:none;
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .screen.active{display:block;}
  .wrap{max-width:560px;margin:0 auto;}

  /* Intro screen */
  a.back{color:var(--dim);text-decoration:none;font-size:13px;}
  a.back:hover{color:var(--fg);}
  h1{font-size:22px;margin:18px 0 6px;}
  p.sub{color:var(--dim);font-size:13px;margin:0 0 28px;}
  .info-box{
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:14px;
  }
  .info-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;}
  .info-row .k{color:var(--dim);}
  .set-btns{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
  button.primary{
    background:var(--fg);color:#000;border:none;border-radius:8px;
    padding:14px;font-size:15px;font-weight:600;cursor:pointer;
  }
  button.secondary{
    background:transparent;color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:14px;font-size:15px;cursor:pointer;
  }
  button.secondary:hover, button.primary:hover{border-color:var(--fg);}

  /* Quiz runner */
  .quiz-top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .close-btn{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;
  }
  .close-btn:hover{color:var(--fg);border-color:var(--fg);}
  .q-count{font-size:13px;color:var(--dim);}
  .progress-track{
    height:4px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-bottom:28px;
  }
  .progress-fill{
    height:100%;background:var(--fg);width:0%;transition:width .25s ease;
  }
  .q-text{font-size:18px;line-height:1.5;margin-bottom:22px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    font-size:14.5px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;
  }
  .option:hover{border-color:var(--fg);}
  .option .letter{color:var(--dim);font-weight:600;min-width:16px;}
  .option.correct{border-color:var(--green);background:rgba(34,197,94,0.08);}
  .option.correct .letter{color:var(--green);}
  .option.wrong{border-color:var(--red);background:rgba(239,68,68,0.08);}
  .option.wrong .letter{color:var(--red);}
  .option.disabled{cursor:default;}
  .option.dim-out{opacity:0.4;}
  .explanation{
    margin-top:16px;padding:14px 16px;border-radius:10px;
    font-size:13.5px;line-height:1.5;border:1px solid var(--line);
  }
  .explanation.wrong-exp{border-color:var(--red);color:#f3a9a9;}
  .explanation.correct-exp{border-color:var(--green);color:#a9e6bf;}
  .nav-row{
    display:flex;justify-content:space-between;margin-top:28px;gap:10px;
  }
  .nav-row button{flex:1;}
  button.nav-btn{
    background:transparent;border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:12px;font-size:14px;cursor:pointer;
  }
  button.nav-btn:hover{border-color:var(--fg);}
  button.nav-btn:disabled{opacity:0.3;cursor:default;}
  button.nav-btn:disabled:hover{border-color:var(--line);}

  /* Results screen */
  .score-circle{
    width:140px;height:140px;border-radius:50%;border:3px solid var(--fg);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    margin:20px auto;
  }
  .score-pct{font-size:32px;font-weight:700;}
  .score-frac{font-size:12px;color:var(--dim);margin-top:2px;}
  .result-msg{text-align:center;font-size:15px;line-height:1.5;margin:20px 0 8px;}
  .pass-tag, .fail-tag{
    text-align:center;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    margin-bottom:6px;
  }
  .pass-tag{color:var(--green);}
  .fail-tag{color:var(--red);}
  .result-btns{display:flex;flex-direction:column;gap:12px;margin-top:28px;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- INTRO SCREEN -->
<div class="screen active" id="screen-intro">
  <div class="wrap">
    <a class="back" href="english.html">&larr; Back to English &amp; GPDP</a>
    <h1>Personality Development &amp; Identifying Personality Types</h1>
    <p class="sub">English &amp; GPDP &middot; Topic 01</p>

    <div class="info-box">
      <div class="info-row"><span class="k">Total questions</span><span id="total-q-display">--</span></div>
      <div class="info-row"><span class="k">Pass mark</span><span>70%</span></div>
      <div class="info-row"><span class="k">Format</span><span id="format-display">--</span></div>
    </div>

    <div class="set-btns" id="set-btns"></div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div class="screen" id="screen-quiz">
  <div class="wrap">
    <div class="quiz-top">
      <button class="close-btn" onclick="closeTest()">Close Test</button>
      <span class="q-count" id="q-count">Question 1 of 30</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div id="explanation-holder"></div>
    <div class="nav-row">
      <button class="nav-btn" id="btn-back" onclick="goBack()">&larr; Back</button>
      <button class="nav-btn" id="btn-next" onclick="goNext()" disabled>Next &rarr;</button>
    </div>
  </div>
</div>

<!-- RESULTS SCREEN -->
<div class="screen" id="screen-results">
  <div class="wrap">
    <h1 style="text-align:center;">Set Complete</h1>
    <div class="score-circle">
      <div class="score-pct" id="score-pct">0%</div>
      <div class="score-frac" id="score-frac">0 / 0</div>
    </div>
    <div id="pass-fail-tag"></div>
    <p class="result-msg" id="result-msg"></p>
    <div class="result-btns" id="result-btns"></div>
  </div>
</div>

<script>
  const questions = [
 {
  "q": "What does MBTI stand for?",
  "options": [
   "Myers-Briggs Type Indicator",
   "Multiple Behavioral Trait Index",
   "Myers Behavioral Type Interpretation",
   "Motivational Behavior Type Inventory"
  ],
  "correct": 0,
  "exp": "MBTI stands for Myers-Briggs Type Indicator, a self-report personality assessment."
 },
 {
  "q": "How many personality types does the MBTI framework identify?",
  "options": [
   "8",
   "12",
   "16",
   "20"
  ],
  "correct": 2,
  "exp": "MBTI identifies sixteen personality types, formed from four dichotomy pairs."
 },
 {
  "q": "The MBTI was inspired by whose theory of psychological types?",
  "options": [
   "Carl Jung",
   "B.F. Skinner",
   "Erik Erikson",
   "Ivan Pavlov"
  ],
  "correct": 0,
  "exp": "The framework was inspired by Carl Jung's theory of psychological types."
 },
 {
  "q": "The MBTI framework is based on how many pairs of opposite preferences?",
  "options": [
   "Two",
   "Three",
   "Four",
   "Five"
  ],
  "correct": 2,
  "exp": "MBTI is based on four pairs of opposite preferences (dichotomies)."
 },
 {
  "q": "The first dichotomy in MBTI, Extraversion vs Introversion, describes a person's:",
  "options": [
   "Direction of energy",
   "Decision-making style",
   "Approach to information",
   "Approach to the external world"
  ],
  "correct": 0,
  "exp": "Extraversion vs Introversion describes where a person naturally directs their energy."
 },
 {
  "q": "A person who naturally leans toward directing energy to the outside world and other people prefers:",
  "options": [
   "Introversion",
   "Extraversion",
   "Sensing",
   "Judging"
  ],
  "correct": 1,
  "exp": "Extraversion describes leaning toward engaging with people, activities, and the external world."
 },
 {
  "q": "Introversion describes individuals who prefer to:",
  "options": [
   "Focus on inner thoughts and reflection",
   "Engage actively with people and activities",
   "Focus on concrete facts",
   "Make quick, spontaneous decisions"
  ],
  "correct": 0,
  "exp": "Introversion reflects a preference for focusing on inner thoughts and reflection."
 },
 {
  "q": "The second MBTI dichotomy, Sensing vs Intuition, reflects a preference for:",
  "options": [
   "Engaging with people",
   "Taking in information",
   "Making decisions",
   "Organizing one's life"
  ],
  "correct": 1,
  "exp": "Sensing vs Intuition describes how a person prefers to take in information."
 },
 {
  "q": "People who prefer Sensing tend to focus on:",
  "options": [
   "Patterns and future possibilities",
   "Concrete facts and present realities",
   "Personal values",
   "Flexible planning"
  ],
  "correct": 1,
  "exp": "Sensing types focus on concrete facts, details, and present realities."
 },
 {
  "q": "People who prefer Intuition tend to look at:",
  "options": [
   "Concrete, present details",
   "Patterns and possibilities",
   "Strict deadlines",
   "Logical consistency only"
  ],
  "correct": 1,
  "exp": "Intuition types look at patterns, ideas, and possibilities — the bigger picture."
 },
 {
  "q": "The third MBTI dichotomy, Thinking vs Feeling, explains how people approach:",
  "options": [
   "Decision-making",
   "Perceiving information",
   "Directing their energy",
   "Organizing their outer life"
  ],
  "correct": 0,
  "exp": "Thinking vs Feeling explains how people approach decision-making."
 },
 {
  "q": "A person with a Thinking preference typically relies on:",
  "options": [
   "Personal values and how actions affect others",
   "Logic, objectivity, and analysis",
   "Spontaneous impulses",
   "Others' opinions above their own reasoning"
  ],
  "correct": 1,
  "exp": "Thinking types base decisions on logic, objectivity, and analysis."
 },
 {
  "q": "A person with a Feeling preference bases decisions on:",
  "options": [
   "Strict logical analysis alone",
   "Personal values and the impact on others",
   "Statistical data only",
   "External rules and deadlines"
  ],
  "correct": 1,
  "exp": "Feeling types base decisions on personal values and how their actions affect others."
 },
 {
  "q": "The fourth MBTI dichotomy, Judging vs Perceiving, describes a person's approach to:",
  "options": [
   "Their outer/external life",
   "Their inner thoughts",
   "Gathering information",
   "Interacting with others"
  ],
  "correct": 0,
  "exp": "Judging vs Perceiving describes how a person approaches their outer, external life."
 },
 {
  "q": "A person with a Judging preference tends to:",
  "options": [
   "Prefer to leave their options open",
   "Prefer structure, planning, and decisiveness",
   "Enjoy spontaneity and improvisation",
   "Dislike making plans in advance"
  ],
  "correct": 1,
  "exp": "Judging types prefer structure, planning, and decisiveness."
 },
 {
  "q": "A person with a Perceiving preference tends to be:",
  "options": [
   "Structured and decisive",
   "Flexible, adaptable, and spontaneous",
   "Rigid about deadlines",
   "Focused only on logical reasoning"
  ],
  "correct": 1,
  "exp": "Perceiving types are flexible, adaptable, and spontaneous."
 },
 {
  "q": "According to the MBTI, is there a \"right\" or \"wrong\" personality type?",
  "options": [
   "Yes, some types are considered superior",
   "No, MBTI does not rank types as right or wrong",
   "Yes, based on career success",
   "Only in professional settings"
  ],
  "correct": 1,
  "exp": "MBTI does not identify any type as right or wrong — it highlights natural tendencies."
 },
 {
  "q": "What is self-awareness?",
  "options": [
   "The ability to understand your thoughts, emotions, strengths, and weaknesses",
   "The ability to memorize company policies",
   "A test measuring intelligence",
   "A skill only needed in written exams"
  ],
  "correct": 0,
  "exp": "Self-awareness is the ability to understand your own thoughts, emotions, strengths, and weaknesses."
 },
 {
  "q": "Strengths are best described as:",
  "options": [
   "Traits, skills, and abilities that help a person perform well",
   "Weaknesses that need fixing",
   "Only physical abilities",
   "Traits everyone shares equally"
  ],
  "correct": 0,
  "exp": "Strengths are the positive traits, skills, and abilities that help someone perform well."
 },
 {
  "q": "Weaknesses are best described as:",
  "options": [
   "Habits or traits that are less developed and may need improvement",
   "Skills that make someone unemployable",
   "Strengths in disguise",
   "Traits that cannot ever change"
  ],
  "correct": 0,
  "exp": "Weaknesses are habits or traits that are less developed or may need improvement."
 }
];

  const SET_SIZE = 30;
  let currentSet = 1;
  let setQuestions = [];
  let currentIndex = 0;
  let answers = []; // {selected, isCorrect}

  function numSets(){ return Math.ceil(questions.length / SET_SIZE); }

  function initIntroScreen(){
    const total = questions.length;
    document.getElementById('total-q-display').textContent = total;
    const n = numSets();
    document.getElementById('format-display').textContent = n > 1 ? `Split into ${n} sets (30 max per set)` : 'Single set';
    const btnHolder = document.getElementById('set-btns');
    btnHolder.innerHTML = '';
    if(n === 1){
      const btn = document.createElement('button');
      btn.className = 'primary';
      btn.textContent = `Start Quiz \u00b7 ${total} Questions`;
      btn.onclick = () => startSet(1);
      btnHolder.appendChild(btn);
    } else {
      for(let i=1;i<=n;i++){
        const start = (i-1)*SET_SIZE+1;
        const end = Math.min(i*SET_SIZE, total);
        const btn = document.createElement('button');
        btn.className = i===1 ? 'primary' : 'secondary';
        btn.textContent = `Start Set ${i} \u00b7 Questions ${start}\u2013${end}`;
        btn.onclick = () => startSet(i);
        btnHolder.appendChild(btn);
      }
    }
  }

  function shuffleOptions(qObj){
    const opts = qObj.options.map((text,i)=>({text, isCorrect:i===qObj.correct}));
    for(let i=opts.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [opts[i],opts[j]]=[opts[j],opts[i]];
    }
    return opts;
  }

  function startSet(setNum){
    currentSet = setNum;
    const start = (setNum-1)*SET_SIZE;
    const end = Math.min(setNum*SET_SIZE, questions.length);
    setQuestions = questions.slice(start, end);
    setQuestions = setQuestions.map(q=>({...q, shuffled: shuffleOptions(q)}));
    currentIndex = 0;
    answers = new Array(setQuestions.length).fill(null);
    showScreen('screen-quiz');
    renderQuestion();
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function renderQuestion(){
    const total = setQuestions.length;
    const qObj = setQuestions[currentIndex];
    document.getElementById('q-count').textContent = `Question ${currentIndex+1} of ${total}`;
    document.getElementById('progress-fill').style.width = `${((currentIndex+1)/total)*100}%`;
    document.getElementById('q-text').textContent = qObj.q;

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    const letters = ['A','B','C','D'];
    const existingAnswer = answers[currentIndex];

    qObj.shuffled.forEach((opt, idx)=>{
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<span class="letter">${letters[idx]}</span><span>${opt.text}</span>`;
      if(existingAnswer !== null){
        div.classList.add('disabled');
        if(opt.isCorrect) div.classList.add('correct');
        if(idx === existingAnswer.selectedIdx && !opt.isCorrect) div.classList.add('wrong');
        if(!opt.isCorrect && idx !== existingAnswer.selectedIdx) div.classList.add('dim-out');
      } else {
        div.onclick = () => selectAnswer(idx);
      }
      optionsDiv.appendChild(div);
    });

    const holder = document.getElementById('explanation-holder');
    holder.innerHTML = '';
    if(existingAnswer !== null){
      const exp = document.createElement('div');
      exp.className = 'explanation ' + (existingAnswer.isCorrect ? 'correct-exp' : 'wrong-exp');
      exp.textContent = existingAnswer.isCorrect ? 'Correct.' : ('Not quite. ' + qObj.exp);
      holder.appendChild(exp);
    }

    document.getElementById('btn-back').disabled = currentIndex===0;
    document.getElementById('btn-next').disabled = existingAnswer===null;
    document.getElementById('btn-next').textContent = currentIndex===total-1 ? 'Finish' : 'Next \u2192';
  }

  function selectAnswer(idx){
    const qObj = setQuestions[currentIndex];
    const isCorrect = qObj.shuffled[idx].isCorrect;
    answers[currentIndex] = {selectedIdx: idx, isCorrect};
    renderQuestion();
  }

  function goNext(){
    if(currentIndex < setQuestions.length-1){
      currentIndex++;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function goBack(){
    if(currentIndex>0){
      currentIndex--;
      renderQuestion();
    }
  }

  function closeTest(){
    showScreen('screen-intro');
  }

  function showResults(){
    const total = setQuestions.length;
    const correctCount = answers.filter(a=>a && a.isCorrect).length;
    const pct = Math.round((correctCount/total)*100);
    document.getElementById('score-pct').textContent = pct + '%';
    document.getElementById('score-frac').textContent = `${correctCount} / ${total}`;

    const tagDiv = document.getElementById('pass-fail-tag');
    const msgDiv = document.getElementById('result-msg');
    const btnsDiv = document.getElementById('result-btns');
    tagDiv.innerHTML = '';
    btnsDiv.innerHTML = '';

    const passed = pct >= 70;
    const tag = document.createElement('div');
    tag.className = passed ? 'pass-tag' : 'fail-tag';
    tag.textContent = passed ? 'Passed' : 'Not Passed';
    tagDiv.appendChild(tag);

    let msg = '';
    if(pct === 100){
      msg = "Perfect score. You've fully mastered this section.";
    } else if(pct >= 90){
      msg = "Excellent work. Keep it up.";
    } else if(pct >= 80){
      msg = "Good result. Keep practicing to sharpen it further.";
    } else if(passed){
      msg = "You passed. A bit more review will make this even stronger.";
    } else {
      msg = "You didn't reach the 70% pass mark this time. Review the explanations and try again.";
    }
    msgDiv.textContent = msg;

    const n = numSets();
    if(passed){
      if(n > 1 && currentSet < n){
        const nextBtn = document.createElement('button');
        nextBtn.className = 'primary';
        nextBtn.textContent = `Continue to Set ${currentSet+1}`;
        nextBtn.onclick = () => startSet(currentSet+1);
        btnsDiv.appendChild(nextBtn);
      } else if(n > 1 && currentSet === n){
        const doneMsg = document.createElement('p');
        doneMsg.style.textAlign = 'center';
        doneMsg.style.color = '#8a8a8a';
        doneMsg.style.fontSize = '13px';
        doneMsg.textContent = "All sets complete.";
        btnsDiv.appendChild(doneMsg);
      }
      const retakeBtn = document.createElement('button');
      retakeBtn.className = 'secondary';
      retakeBtn.textContent = 'Retake This Set';
      retakeBtn.onclick = () => startSet(currentSet);
      btnsDiv.appendChild(retakeBtn);
    } else {
      const retakeBtn = document.createElement('button');
      retakeBtn.className = 'primary';
      retakeBtn.textContent = 'Retake This Set';
      retakeBtn.onclick = () => startSet(currentSet);
      btnsDiv.appendChild(retakeBtn);
    }

    const closeBtn = document.createElement('button');
    closeBtn.className = 'secondary';
    closeBtn.textContent = 'Close Test';
    closeBtn.onclick = closeTest;
    btnsDiv.appendChild(closeBtn);

    showScreen('screen-results');
  }

  initIntroScreen();

</script>
</body>
</html>
