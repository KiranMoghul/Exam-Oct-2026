<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCA Exam Revision</title>
<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --dim:#8a8a8a;
    --line:#2a2a2a;
    --green:#22c55e;
    --red:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px;
  }
  h1{
    font-size:28px;
    letter-spacing:0.02em;
    margin:0 0 8px;
    text-align:center;
  }
  p.sub{
    color:var(--dim);
    margin:0 0 40px;
    text-align:center;
    font-size:14px;
  }
  .papers{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  a.paper-card{
    display:block;
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px;
    text-decoration:none;
    color:var(--fg);
    transition:border-color .15s ease, transform .15s ease;
  }
  a.paper-card:hover{
    border-color:var(--fg);
    transform:translateY(-2px);
  }
  .paper-label{
    font-size:12px;
    color:var(--dim);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:6px;
  }
  .paper-title{
    font-size:20px;
    font-weight:600;
  }
  .paper-meta{
    font-size:13px;
    color:var(--dim);
    margin-top:8px;
  }
  footer{
    margin-top:56px;
    color:var(--line);
    font-size:11px;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>DCA Exam Revision &mdash; Oct 2026</h1>
  <p class="sub">Select a paper to begin</p>
  <div class="papers">
    <a class="paper-card" href="culinary.html">
      <div class="paper-label">Paper 1</div>
      <div class="paper-title">Culinary Arts</div>
      <div class="paper-meta">10 topics &middot; 170 MCQs</div>
    </a>
    <a class="paper-card" href="english.html">
      <div class="paper-label">Paper 2</div>
      <div class="paper-title">English &amp; GPDP</div>
      <div class="paper-meta">13 topics &middot; 213 MCQs</div>
    </a>
  </div>
  <footer>COTHM DCA &middot; Oct 2026</footer>
</body>
</html>
