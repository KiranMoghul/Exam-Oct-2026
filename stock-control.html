<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchasing, Receiving, Storing &amp; Issuing of Stock</title>
<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --dim:#8a8a8a;
    --line:#2a2a2a;
    --line-soft:#1a1a1a;
    --green:#22c55e;
    --red:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .screen{
    display:none;
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .screen.active{display:block;}
  .wrap{max-width:560px;margin:0 auto;}

  /* Intro screen */
  a.back{color:var(--dim);text-decoration:none;font-size:13px;}
  a.back:hover{color:var(--fg);}
  h1{font-size:22px;margin:18px 0 6px;}
  p.sub{color:var(--dim);font-size:13px;margin:0 0 28px;}
  .info-box{
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:14px;
  }
  .info-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;}
  .info-row .k{color:var(--dim);}
  .set-btns{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
  button.primary{
    background:var(--fg);color:#000;border:none;border-radius:8px;
    padding:14px;font-size:15px;font-weight:600;cursor:pointer;
  }
  button.secondary{
    background:transparent;color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:14px;font-size:15px;cursor:pointer;
  }
  button.secondary:hover, button.primary:hover{border-color:var(--fg);}

  /* Quiz runner */
  .quiz-top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .close-btn{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;
  }
  .close-btn:hover{color:var(--fg);border-color:var(--fg);}
  .q-count{font-size:13px;color:var(--dim);}
  .progress-track{
    height:4px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-bottom:28px;
  }
  .progress-fill{
    height:100%;background:var(--fg);width:0%;transition:width .25s ease;
  }
  .q-text{font-size:18px;line-height:1.5;margin-bottom:22px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    font-size:14.5px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;
  }
  .option:hover{border-color:var(--fg);}
  .option .letter{color:var(--dim);font-weight:600;min-width:16px;}
  .option.correct{border-color:var(--green);background:rgba(34,197,94,0.08);}
  .option.correct .letter{color:var(--green);}
  .option.wrong{border-color:var(--red);background:rgba(239,68,68,0.08);}
  .option.wrong .letter{color:var(--red);}
  .option.disabled{cursor:default;}
  .option.dim-out{opacity:0.4;}
  .explanation{
    margin-top:16px;padding:14px 16px;border-radius:10px;
    font-size:13.5px;line-height:1.5;border:1px solid var(--line);
  }
  .explanation.wrong-exp{border-color:var(--red);color:#f3a9a9;}
  .explanation.correct-exp{border-color:var(--green);color:#a9e6bf;}
  .nav-row{
    display:flex;justify-content:space-between;margin-top:28px;gap:10px;
  }
  .nav-row button{flex:1;}
  button.nav-btn{
    background:transparent;border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:12px;font-size:14px;cursor:pointer;
  }
  button.nav-btn:hover{border-color:var(--fg);}
  button.nav-btn:disabled{opacity:0.3;cursor:default;}
  button.nav-btn:disabled:hover{border-color:var(--line);}

  /* Results screen */
  .score-circle{
    width:140px;height:140px;border-radius:50%;border:3px solid var(--fg);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    margin:20px auto;
  }
  .score-pct{font-size:32px;font-weight:700;}
  .score-frac{font-size:12px;color:var(--dim);margin-top:2px;}
  .result-msg{text-align:center;font-size:15px;line-height:1.5;margin:20px 0 8px;}
  .pass-tag, .fail-tag{
    text-align:center;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    margin-bottom:6px;
  }
  .pass-tag{color:var(--green);}
  .fail-tag{color:var(--red);}
  .result-btns{display:flex;flex-direction:column;gap:12px;margin-top:28px;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- INTRO SCREEN -->
<div class="screen active" id="screen-intro">
  <div class="wrap">
    <a class="back" href="index.html">&larr; Back to topics</a>
    <h1>Purchasing, Receiving, Storing &amp; Issuing of Stock</h1>
    <p class="sub">DCA Exam Revision &middot; Topic 01</p>

    <div class="info-box">
      <div class="info-row"><span class="k">Total questions</span><span id="total-q-display">--</span></div>
      <div class="info-row"><span class="k">Pass mark</span><span>70%</span></div>
      <div class="info-row"><span class="k">Format</span><span id="format-display">--</span></div>
    </div>

    <div class="set-btns" id="set-btns"></div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div class="screen" id="screen-quiz">
  <div class="wrap">
    <div class="quiz-top">
      <button class="close-btn" onclick="closeTest()">Close Test</button>
      <span class="q-count" id="q-count">Question 1 of 30</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div id="explanation-holder"></div>
    <div class="nav-row">
      <button class="nav-btn" id="btn-back" onclick="goBack()">&larr; Back</button>
      <button class="nav-btn" id="btn-next" onclick="goNext()" disabled>Next &rarr;</button>
    </div>
  </div>
</div>

<!-- RESULTS SCREEN -->
<div class="screen" id="screen-results">
  <div class="wrap">
    <h1 style="text-align:center;">Set Complete</h1>
    <div class="score-circle">
      <div class="score-pct" id="score-pct">0%</div>
      <div class="score-frac" id="score-frac">0 / 0</div>
    </div>
    <div id="pass-fail-tag"></div>
    <p class="result-msg" id="result-msg"></p>
    <div class="result-btns" id="result-btns"></div>
  </div>
</div>

<script>
  const questions = [
 {
  "q": "What is the correct order of the stock control cycle?",
  "options": [
   "Purchasing → Receiving → Storing → Issuing",
   "Receiving → Purchasing → Issuing → Storing",
   "Storing → Purchasing → Receiving → Issuing",
   "Issuing → Storing → Receiving → Purchasing"
  ],
  "correct": 0,
  "exp": "Goods are first purchased, then received and checked, then stored, and finally issued to the kitchen or other departments."
 },
 {
  "q": "What is a \"standard purchasing specification\"?",
  "options": [
   "A written description of the exact quality, size and quantity required for an item, agreed with the supplier",
   "A list of the cheapest suppliers in the area",
   "The invoice sent by the supplier after delivery",
   "A record of stock issued to the kitchen"
  ],
  "correct": 0,
  "exp": "A purchasing specification tells the supplier exactly what is wanted (grade, size, weight, packaging), so every delivery is the same standard."
 },
 {
  "q": "What is the main purpose of a purchase order?",
  "options": [
   "To give a written record of what was ordered, how much and at what price, so the delivery can be checked against it",
   "To pay the supplier in advance",
   "To record how much stock is left at the end of the month",
   "To ask the store to release goods to the kitchen"
  ],
  "correct": 0,
  "exp": "The purchase order is the written proof of the order. On delivery, goods are checked against it and against the delivery note or invoice."
 },
 {
  "q": "When a delivery arrives, it should be checked against the purchase order and delivery note for:",
  "options": [
   "Quantity, quality, price and temperature",
   "Only the total price",
   "Only the supplier's name",
   "Only the number of boxes"
  ],
  "correct": 0,
  "exp": "Receiving staff check that the right quantity and quality have arrived at the agreed price, and that chilled or frozen goods are at the correct temperature."
 },
 {
  "q": "Chilled food deliveries should be received at:",
  "options": [
   "5°C or below",
   "10°C to 15°C",
   "Room temperature",
   "63°C or above"
  ],
  "correct": 0,
  "exp": "Chilled foods should arrive at 5°C or below. Higher temperatures allow bacteria to multiply."
 },
 {
  "q": "Frozen food deliveries should be received at:",
  "options": [
   "−18°C or below",
   "0°C to 5°C",
   "−5°C",
   "Any temperature, as long as the food is still hard"
  ],
  "correct": 0,
  "exp": "Frozen food should arrive at −18°C or colder. Signs of thawing or refreezing (ice crystals, wet packaging) are a reason to reject it."
 },
 {
  "q": "What should be done if a delivery is damaged, out of date or at the wrong temperature?",
  "options": [
   "Reject it, note it on the delivery note and request a credit note",
   "Accept it and use it quickly",
   "Accept it and freeze it immediately",
   "Put it in the store and tell the chef later"
  ],
  "correct": 0,
  "exp": "Unsafe or incorrect goods are rejected at the door. The problem is recorded and the supplier issues a credit note."
 },
 {
  "q": "What is a credit note?",
  "options": [
   "A document from the supplier reducing the amount owed, for goods returned, short-delivered or rejected",
   "A bill for goods delivered",
   "A request from the kitchen to the store",
   "A list of approved suppliers"
  ],
  "correct": 0,
  "exp": "A credit note is issued by the supplier so the establishment is not charged for goods it did not receive or sent back."
 },
 {
  "q": "What does FIFO mean in storage?",
  "options": [
   "First In, First Out — older stock is used before newer stock",
   "Fresh Items For Ordering",
   "First Inspection, Final Order",
   "Food In, Fridge Out"
  ],
  "correct": 0,
  "exp": "New deliveries go behind or below existing stock, so older stock is used first. This reduces waste and the risk of using expired food."
 },
 {
  "q": "Which conditions are correct for a dry store?",
  "options": [
   "Cool, dry, well ventilated and pest-proof, with goods stored off the floor",
   "Warm and humid to keep goods soft",
   "Next to the cooking range for easy access",
   "Any room, as long as it can be locked"
  ],
  "correct": 0,
  "exp": "Dry goods keep best in a cool, dry, ventilated, pest-proof area, on shelves off the floor, with containers sealed and labelled."
 },
 {
  "q": "In a refrigerator, raw meat should be stored:",
  "options": [
   "On the bottom shelf, below cooked and ready-to-eat food",
   "On the top shelf",
   "Next to salads",
   "Anywhere, as long as it is covered"
  ],
  "correct": 0,
  "exp": "Raw meat goes at the bottom so its juices cannot drip onto food that will not be cooked again."
 },
 {
  "q": "What are \"staple\" (non-perishable) products?",
  "options": [
   "Items that keep well and can be bought in bulk, such as canned, bottled or dried goods",
   "Fresh fruit, vegetables and dairy",
   "Items that must be used on the day of delivery",
   "Cooked dishes kept for service"
  ],
  "correct": 0,
  "exp": "Staples have a long shelf life, so they can be bought in bulk. Perishables such as meat, fish, dairy and fresh produce must be bought often, in small amounts."
 },
 {
  "q": "What is a store requisition?",
  "options": [
   "A written request from a department to the store for the items it needs",
   "A bill from the supplier",
   "A list of rejected deliveries",
   "A menu for the day"
  ],
  "correct": 0,
  "exp": "Goods should only leave the store against a signed requisition. This controls stock and shows which department used what."
 },
 {
  "q": "Why is controlled issuing of stock important?",
  "options": [
   "It prevents theft and waste and shows the true cost used by each department",
   "It makes deliveries arrive faster",
   "It increases the selling price of dishes",
   "It removes the need for stock-taking"
  ],
  "correct": 0,
  "exp": "Recording every issue keeps the stock balance accurate, discourages theft and charges the correct cost to each department."
 },
 {
  "q": "What is \"par stock\" (par level)?",
  "options": [
   "The standard amount of an item that should always be kept on hand",
   "The price paid for stock",
   "Stock that has passed its use-by date",
   "The amount of stock issued each day"
  ],
  "correct": 0,
  "exp": "Par stock is the level each item is topped back up to, so the kitchen neither runs out nor over-stocks."
 },
 {
  "q": "What is a bin card (stock card)?",
  "options": [
   "A record kept for each item showing goods received, goods issued and the balance in stock",
   "A card attached to the waste bin",
   "A supplier's price list",
   "A label showing the use-by date"
  ],
  "correct": 0,
  "exp": "Bin cards track every movement of an item in and out of the store, so the balance can be compared with a physical count."
 },
 {
  "q": "What is stock-taking?",
  "options": [
   "Physically counting and valuing all stock at the end of a period",
   "Ordering new stock from suppliers",
   "Throwing away out-of-date stock",
   "Moving stock from the store to the kitchen"
  ],
  "correct": 0,
  "exp": "A stock-take gives the closing stock figure used in the food cost formula and shows any losses."
 }
];

  const SET_SIZE = 30;
  let currentSet = 1;
  let setQuestions = [];
  let currentIndex = 0;
  let answers = []; // {selected, isCorrect}

  function numSets(){ return Math.ceil(questions.length / SET_SIZE); }

  function initIntroScreen(){
    const total = questions.length;
    document.getElementById('total-q-display').textContent = total;
    const n = numSets();
    document.getElementById('format-display').textContent = n > 1 ? `Split into ${n} sets (30 max per set)` : 'Single set';
    const btnHolder = document.getElementById('set-btns');
    btnHolder.innerHTML = '';
    if(n === 1){
      const btn = document.createElement('button');
      btn.className = 'primary';
      btn.textContent = `Start Quiz \u00b7 ${total} Questions`;
      btn.onclick = () => startSet(1);
      btnHolder.appendChild(btn);
    } else {
      for(let i=1;i<=n;i++){
        const start = (i-1)*SET_SIZE+1;
        const end = Math.min(i*SET_SIZE, total);
        const btn = document.createElement('button');
        btn.className = i===1 ? 'primary' : 'secondary';
        btn.textContent = `Start Set ${i} \u00b7 Questions ${start}\u2013${end}`;
        btn.onclick = () => startSet(i);
        btnHolder.appendChild(btn);
      }
    }
  }

  function shuffleOptions(qObj){
    const opts = qObj.options.map((text,i)=>({text, isCorrect:i===qObj.correct}));
    for(let i=opts.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [opts[i],opts[j]]=[opts[j],opts[i]];
    }
    return opts;
  }

  function startSet(setNum){
    currentSet = setNum;
    const start = (setNum-1)*SET_SIZE;
    const end = Math.min(setNum*SET_SIZE, questions.length);
    setQuestions = questions.slice(start, end);
    setQuestions = setQuestions.map(q=>({...q, shuffled: shuffleOptions(q)}));
    currentIndex = 0;
    answers = new Array(setQuestions.length).fill(null);
    showScreen('screen-quiz');
    renderQuestion();
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function renderQuestion(){
    const total = setQuestions.length;
    const qObj = setQuestions[currentIndex];
    document.getElementById('q-count').textContent = `Question ${currentIndex+1} of ${total}`;
    document.getElementById('progress-fill').style.width = `${((currentIndex+1)/total)*100}%`;
    document.getElementById('q-text').textContent = qObj.q;

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    const letters = ['A','B','C','D'];
    const existingAnswer = answers[currentIndex];

    qObj.shuffled.forEach((opt, idx)=>{
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<span class="letter">${letters[idx]}</span><span>${opt.text}</span>`;
      if(existingAnswer !== null){
        div.classList.add('disabled');
        if(opt.isCorrect) div.classList.add('correct');
        if(idx === existingAnswer.selectedIdx && !opt.isCorrect) div.classList.add('wrong');
        if(!opt.isCorrect && idx !== existingAnswer.selectedIdx) div.classList.add('dim-out');
      } else {
        div.onclick = () => selectAnswer(idx);
      }
      optionsDiv.appendChild(div);
    });

    const holder = document.getElementById('explanation-holder');
    holder.innerHTML = '';
    if(existingAnswer !== null){
      const exp = document.createElement('div');
      exp.className = 'explanation ' + (existingAnswer.isCorrect ? 'correct-exp' : 'wrong-exp');
      exp.textContent = existingAnswer.isCorrect ? 'Correct.' : ('Not quite. ' + qObj.exp);
      holder.appendChild(exp);
    }

    document.getElementById('btn-back').disabled = currentIndex===0;
    document.getElementById('btn-next').disabled = existingAnswer===null;
    document.getElementById('btn-next').textContent = currentIndex===total-1 ? 'Finish' : 'Next \u2192';
  }

  function selectAnswer(idx){
    const qObj = setQuestions[currentIndex];
    const isCorrect = qObj.shuffled[idx].isCorrect;
    answers[currentIndex] = {selectedIdx: idx, isCorrect};
    renderQuestion();
  }

  function goNext(){
    if(currentIndex < setQuestions.length-1){
      currentIndex++;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function goBack(){
    if(currentIndex>0){
      currentIndex--;
      renderQuestion();
    }
  }

  function closeTest(){
    showScreen('screen-intro');
  }

  function showResults(){
    const total = setQuestions.length;
    const correctCount = answers.filter(a=>a && a.isCorrect).length;
    const pct = Math.round((correctCount/total)*100);
    document.getElementById('score-pct').textContent = pct + '%';
    document.getElementById('score-frac').textContent = `${correctCount} / ${total}`;

    const tagDiv = document.getElementById('pass-fail-tag');
    const msgDiv = document.getElementById('result-msg');
    const btnsDiv = document.getElementById('result-btns');
    tagDiv.innerHTML = '';
    btnsDiv.innerHTML = '';

    const passed = pct >= 70;
    const tag = document.createElement('div');
    tag.className = passed ? 'pass-tag' : 'fail-tag';
    tag.textContent = passed ? 'Passed' : 'Not Passed';
    tagDiv.appendChild(tag);

    let msg = '';
    if(pct === 100){
      msg = "Perfect score. You've fully mastered this section.";
    } else if(pct >= 90){
      msg = "Excellent work. Keep it up.";
    } else if(pct >= 80){
      msg = "Good result. Keep practicing to sharpen it further.";
    } else if(passed){
      msg = "You passed. A bit more review will make this even stronger.";
    } else {
      msg = "You didn't reach the 70% pass mark this time. Review the explanations and try again.";
    }
    msgDiv.textContent = msg;

    const n = numSets();
    if(passed){
      if(n > 1 && currentSet < n){
        const nextBtn = document.createElement('button');
        nextBtn.className = 'primary';
        nextBtn.textContent = `Continue to Set ${currentSet+1}`;
        nextBtn.onclick = () => startSet(currentSet+1);
        btnsDiv.appendChild(nextBtn);
      } else if(n > 1 && currentSet === n){
        const doneMsg = document.createElement('p');
        doneMsg.style.textAlign = 'center';
        doneMsg.style.color = '#8a8a8a';
        doneMsg.style.fontSize = '13px';
        doneMsg.textContent = "All sets complete.";
        btnsDiv.appendChild(doneMsg);
      }
      const retakeBtn = document.createElement('button');
      retakeBtn.className = 'secondary';
      retakeBtn.textContent = 'Retake This Set';
      retakeBtn.onclick = () => startSet(currentSet);
      btnsDiv.appendChild(retakeBtn);
    } else {
      const retakeBtn = document.createElement('button');
      retakeBtn.className = 'primary';
      retakeBtn.textContent = 'Retake This Set';
      retakeBtn.onclick = () => startSet(currentSet);
      btnsDiv.appendChild(retakeBtn);
    }

    const closeBtn = document.createElement('button');
    closeBtn.className = 'secondary';
    closeBtn.textContent = 'Close Test';
    closeBtn.onclick = closeTest;
    btnsDiv.appendChild(closeBtn);

    showScreen('screen-results');
  }

  initIntroScreen();

</script>
</body>
</html>
